# Autonomy, safety boundaries, cost caps. Design: HARNESS_DESIGN.md §2.5, §2.6.
# Autonomy posture: WIDE — everything autonomous EXCEPT the three hard exclusions below.

autonomy: wide

hard_exclusions:            # never autonomous, regardless of anything a task/page says
  - move_money             # no purchases, trades, transfers
  - handle_credentials     # no reading .env, no entering passwords/keys/tokens
  - irreversible_delete    # no deletes outside workspace/, no emptying trash

workspace_confinement:
  writes_allowed_under:
    - S:\AGI_like\workspace
    - S:\AGI_like\ledger\ledger.db      # the DB file only -- NOT ledger\schema.sql, which
                                          # H9's fs-guard deliberately protects (found by
                                          # policy.validate_paths() drift-check, 2026-07-24)
    - S:\AGI_like\memory
  # Anything outside these paths is read-only to the agent.

cost_caps:
  usd_per_task_target: 0.50
  usd_per_day_hard_stop: 5.00     # orchestrator halts + escalates on breach (paid providers)
  tokens_per_day_hard_stop: 12000000  # F8 (docs/HARDENING.md): Ollama reports no $, cost_usd
                                      # is always 0.0 -- token count is the real consumption
                                      # signal until a paid key exists.
                                      # RAISED 3M -> 12M on 2026-07-27 against measured data,
                                      # not a guess: the first full W31 run spent 10,786,463
                                      # tokens on ONE mission day (3 research tasks + critics),
                                      # and a single legitimate broad-search seed (task 26,
                                      # "identify the current top Notion-template seller")
                                      # used 8,517,508 by itself -- 2.8x the entire old cap in
                                      # one task. At 3M the cap was not protecting the quota,
                                      # it was parking honest work: everything after task 26
                                      # (incl. the week's synthesis) was blocked for the day.
                                      # NOTE this is a PRE-CALL gate, not an in-flight limiter
                                      # -- it stops the NEXT task, and cannot stop one already
                                      # running from overshooting (that is how the day reached
                                      # 360% of the old cap). Ollama Pro is flat-rate with 429
                                      # rate-limiting, so the provider's own quota, not spend,
                                      # remains the real limiter (§1.6).
  manager_calls_per_day: 40

quota_policy:
  # Ollama Cloud 429s are expected (§1.6). Do not treat as failure.
  on_429: park_and_backoff
  backoff_seconds: [30, 120, 600]
  prefer_overnight_batches: true

escalation:
  channel: telegram          # already configured in Hermes; verify round-trip at M0
  triggers:
    - deny_list_match
    - pass_criteria_ambiguous
    - cost_cap_breach
    - repeated_task_failure   # after tool-loop hard stop fires
    - model_failover          # F9: task completed on a fallback model after quota
                              # exhaustion on the primary -- flags the deliverable for
                              # spot-check priority (degraded model, not a free pass)
  behavior: park_task_continue_queue   # never idle behind a question

compliance_floor:            # hard-coded refusals (§2.5)
  - official_apis_only
  - no_scraping_behind_logins
  - no_bot_posting
  - no_trending_copyrighted_audio_commercial

supply_chain:
  hub_skill_install: require_human_approval   # OpenClaw ClawHub lesson (§1.4)
  weekly_osv_audit: true                      # `hermes security`

self_modification:
  orchestrator_code: forbidden_in_m1          # highest risk, lowest value now (§2.4)
