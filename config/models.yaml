# Model routing — the ONLY place model choices live. Swap here, never in code.
# Design: HARNESS_DESIGN.md §2.2. Measured facts: HARNESS_DESIGN.md §1.6.

roles:
  manager:
    # Frontier reasoning for planning, evaluation, memory promotion. Low-volume/high-value.
    # PREFERRED once an Anthropic key is in Hermes .env:
    #   provider: anthropic
    #   model: claude-sonnet-5      # or claude-fable-5 for hardest planning
    # CURRENT default until key added (WARNING: 429s under load — see §1.6):
    provider: ollama
    model: glm-5.2:cloud
    quota_group: ollama-cloud      # F39: shares one account 429 — see fallback_chain
    max_calls_per_day: 40          # low volume by design; guards cost + quota

  critic:
    # Separate prompt, and a DIFFERENT model from the worker when affordable
    # (independent judge — see §2.4). Falls back to manager model if unset.
    provider: ollama
    model: glm-5.2:cloud
    quota_group: ollama-cloud

  worker:
    # Bulk research/analysis. Shares Ollama Cloud account quota with manager
    # unless manager moves to Anthropic (recommended — decouples the pools).
    provider: ollama
    model: kimi-k2.7-code:cloud
    quota_group: ollama-cloud

  fallback:
    # MEASURED 1.54 tok/s on this box (2026-07-17). Emergency / offline batch ONLY.
    # Never assign a live, latency-sensitive role here.
    # F38: the capped variant, not plain gemma4:12b — the uncapped model cannot LOAD on
    # this box at all (KV cache OOM at its 262k default context).
    provider: ollama
    model: gemma4:12b-ctx4k
    context_tokens: 4096
    # No quota_group: local inference draws on no shared quota pool, so a cloud 429 must
    # never cause this rung to be skipped.
    # F50: context_tokens is the num_ctx baked into the Modelfile by F38. Declaring it lets
    # the failover chain skip this rung when a prompt provably cannot fit, instead of
    # stalling ~1800s at 1.5 tok/s and failing with nothing useful to say. Measured: a
    # synthesis prompt needs ~9,800-15,100 tok, so it is correctly skipped for those and
    # still tried for anything that fits.

  embeddings:
    # Deferred: FTS5 (Hermes built-in) first. Enable only if recall demands it.
    enabled: false
    provider: ollama
    model: nomic-embed-text

# Available provider transports. Declaring a provider does not activate it for any
# role or fallback. Authentication values are resolved from the named environment
# variable only at dispatch and are never stored here.
providers:
  byteplus_coding:
    endpoint: https://ark.ap-southeast.bytepluses.com/api/coding/v3
    authentication_reference: env:ARK_API_KEY
    routing_model: ark-code-latest
    hermes_provider: custom:byteplus-coding

  anthropic:
    endpoint: https://api.anthropic.com/v1
    authentication_reference: env:ANTHROPIC_API_KEY
    routing_model: claude-sonnet-5
    hermes_provider: anthropic

  openai:
    endpoint: https://api.openai.com/v1
    authentication_reference: env:OPENAI_API_KEY
    routing_model: gpt-4o
    hermes_provider: openai-api

# Cross-PROVIDER fallback chain (429 is account-level, not per-model — §1.6).
# A second Ollama model does NOT survive quota exhaustion; a second provider does.
#
# `quota_group` (F39, docs/HARDENING.md) makes that fact MACHINE-READABLE instead of a
# comment nobody's code reads. Rungs sharing a group share one 429, so once any of them
# returns a quota error the rest are skipped rather than tried and failed. Measured
# 2026-07-29: every canary spent ~30s calling glm-5.2:cloud immediately after
# kimi-k2.7-code:cloud had already 429'd, on the same account, for a guaranteed refusal.
# A rung with NO quota_group is its own pool and is never skipped by inference.
fallback_chain:
  - { provider: ollama, model: glm-5.2:cloud,        quota_group: ollama-cloud }
  - { provider: ollama, model: kimi-k2.7-code:cloud, quota_group: ollama-cloud }
  - { provider: anthropic, model: claude-sonnet-5 }                              # no quota_group — genuinely separate
  - { provider: openai, model: gpt-4o }                                          # no quota_group — genuinely separate
  # The two rungs above have NO quota_group: a genuinely separate account is the
  # whole point, and is the only thing that makes this chain cross-PROVIDER rather
  # than cross-model.
  # F38 (docs/HARDENING.md), 2026-07-29: was plain `gemma4:12b`, which had NEVER once
  # completed a task -- every attempt died with llama-server OOM at startup. The cause was
  # not the 7.6GB weights on a 4GB GPU but the KV CACHE, sized from this model's default
  # 262,144-token context. Neither the hermes CLI nor ollama_chat() passes num_ctx, so the
  # full cache was allocated every time. The -ctx4k variant bakes num_ctx=4096 in, which
  # fixes BOTH callers without code changes. Proven with no caller options, the way hermes
  # actually calls it: `gemma4:12b` FAILS, `gemma4:12b-ctx4k` loads in 103s at 1.5 tok/s.
  # Rebuild: ollama create gemma4:12b-ctx4k -f config/gemma4-12b-ctx4k.Modelfile
  # F50 (docs/HARDENING.md), 2026-07-30: `context_tokens` declares that 4,096 so the chain
  # can skip this rung when a prompt provably will not fit. It follows quota_group's opt-in
  # rule above -- a rung declaring none is never skipped by inference, so a missing value
  # can only waste a call, never skip a rung that would have worked. Measured: synthesis
  # prompts need ~9,800-15,100 tok, so this rung had NEVER been able to serve that path at
  # any brief cap this project has used; it is now skipped there and still tried elsewhere.
  - { provider: ollama, model: gemma4:12b-ctx4k, context_tokens: 4096 }  # last resort, ~1.5 tok/s
