# Worker egress is deny-by-default. This file configures the broker contract;
# the Windows/AppContainer boundary is provisioned outside the repository and
# attested through HARNESS_EGRESS_ATTESTATION before any worker may launch.
schema_version: 1
mode: broker_required
broker:
  host: 127.0.0.1
  port: 8787
  connect_port: 443
  idle_timeout_seconds: 120
  max_connection_bytes: 10485760
  allowed_hosts:
    - ark.ap-southeast.bytepluses.com
    - api.anthropic.com
    - api.openai.com
    - api.ollama.com
    - duckduckgo.com
    - html.duckduckgo.com
    - links.duckduckgo.com
    - flowgpt.com
    - www.flowgpt.com
    - guide.flowgpt.com
    - docs.flowgpt.com
    - blog.flowgpt.com
    - flowgpt.ai
    - www.flowgpt.ai
    - crunchbase.com
    - www.crunchbase.com
    - linkedin.com
    - www.linkedin.com
    - techcrunch.com
    - www.techcrunch.com
    - similarweb.com
    - www.similarweb.com
    - hubpy.io
    - news.ycombinator.com
    - ycombinator.com
    - archive.org
    - web.archive.org
    - aigearbase.com
    - www.aigearbase.com
    - skywork.ai
    - saasworthy.com
    - www.saasworthy.com
    - dimensionmarketresearch.com
    - www.dimensionmarketresearch.com
    - thebusinessresearchcompany.com
    - www.thebusinessresearchcompany.com
    - grandviewresearch.com
    - www.grandviewresearch.com
    - insightaceanalytic.com
    - www.insightaceanalytic.com
    - researchandmarkets.com
    - www.researchandmarkets.com
    - compworth.com
    - www.compworth.com
    - businessmodelcanvastemplate.com
    - www.businessmodelcanvastemplate.com
attestation:
  environment_variable: HARNESS_EGRESS_ATTESTATION
  purpose: egress-boundary-v1
  max_age_hours: 24
  required_evidence:
    - restricted_worker_identity
    - deny_direct_egress
    - broker_only_egress
    - raw_socket_bypass_test
    - private_address_test
  required_claims:
    - worker_identity
    - worker_program_sha256
    - broker_program_sha256
    - boundary_policy_id
audit_log_environment_variable: HARNESS_EGRESS_AUDIT
