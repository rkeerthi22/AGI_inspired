# Worker egress is deny-by-default. This file configures the broker contract;
# the Windows/AppContainer boundary is provisioned outside the repository and
# attested through HARNESS_EGRESS_ATTESTATION before any worker may launch.
schema_version: 1
mode: broker_required
broker:
