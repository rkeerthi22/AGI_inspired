name: model-free-gate

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  windows-model-free:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bootstrap
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Run Model-Free Gate
        shell: pwsh
        run: ./scripts/ci.ps1
